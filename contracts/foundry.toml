# Vendored deps live in lib/ (gitignored — provision by hand):
#   lib/openzeppelin-contracts  MUST be >= v4.9.0 (stable ERC20Permit; the
#                               draft- import was removed). Current: v4.9.6.
#   lib/forge-std               any recent v1.x
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.25"
optimizer = true
optimizer_runs = 1000

remappings = [
    "openzeppelin-contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
