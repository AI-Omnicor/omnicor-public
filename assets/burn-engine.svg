<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect width="960" height="400" rx="16" fill="#0E0F13"/>
  <text x="480" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="bold">The burn engine — three independent sources</text>

  <!-- source 1 -->
  <rect x="60" y="80" width="260" height="120" rx="12" fill="#17181F" stroke="#7C3AED"/>
  <text x="190" y="108" text-anchor="middle" fill="#D2A8FF" font-size="13" font-weight="bold">EVERY TRANSACTION</text>
  <g fill="#FFFFFF" font-size="11.5" text-anchor="middle">
    <text x="190" y="132">FeeSplitter.sweep() — immutable</text>
    <text x="190" y="152">70% → burn · 30% → Treasury</text>
    <text x="190" y="172" fill="#9CA3AF" font-size="10.5">hardcoded BURN_BPS = 7000</text>
  </g>

  <!-- source 2 -->
  <rect x="350" y="80" width="260" height="120" rx="12" fill="#17181F" stroke="#7C3AED"/>
  <text x="480" y="108" text-anchor="middle" fill="#D2A8FF" font-size="13" font-weight="bold">PLATFORM REVENUE</text>
  <g fill="#FFFFFF" font-size="11.5" text-anchor="middle">
    <text x="480" y="132">every ride books an OMNI debt</text>
    <text x="480" y="152">rate locked at record time</text>
    <text x="480" y="172" fill="#9CA3AF" font-size="10.5">Safe settles → transfer → DEAD</text>
  </g>

  <!-- source 3 -->
  <rect x="640" y="80" width="260" height="120" rx="12" fill="#17181F" stroke="#7C3AED"/>
  <text x="770" y="108" text-anchor="middle" fill="#D2A8FF" font-size="13" font-weight="bold">UNCLAIMED RESERVE</text>
  <g fill="#FFFFFF" font-size="11.5" text-anchor="middle">
    <text x="770" y="132">quarterly tranche expires</text>
    <text x="770" y="152">→ contract burns it itself</text>
    <text x="770" y="172" fill="#9CA3AF" font-size="10.5">next tranche gates on the burn</text>
  </g>

  <!-- arrows to DEAD -->
  <g stroke="#EF4444" stroke-width="2.5" fill="#EF4444">
    <line x1="190" y1="208" x2="430" y2="262"/><polygon points="430,256 444,266 428,270"/>
    <line x1="480" y1="208" x2="480" y2="258"/><polygon points="474,258 480,272 486,258"/>
    <line x1="770" y1="208" x2="530" y2="262"/><polygon points="530,256 516,266 532,270"/>
  </g>

  <!-- DEAD -->
  <rect x="380" y="272" width="200" height="60" rx="12" fill="#1F0505" stroke="#EF4444" stroke-width="2"/>
  <text x="480" y="298" text-anchor="middle" fill="#EF4444" font-size="15" font-weight="bold">0x000…dEaD</text>
  <text x="480" y="318" text-anchor="middle" fill="#FCA5A5" font-size="10.5">unrecoverable forever · public counters</text>

  <text x="480" y="368" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="bold">Emission only decays — supply can only shrink.</text>
</svg>
