<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <rect width="960" height="430" rx="16" fill="#0E0F13"/>
  <text x="480" y="42" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="bold">Supply — 1,000,000,000 OMNI, fixed forever</text>

  <!-- allocation bars -->
  <text x="60" y="90" fill="#D2A8FF" font-size="13" font-weight="bold">ALLOCATION</text>
  <g font-size="12" fill="#FFFFFF">
    <rect x="60" y="104" width="36" height="34" rx="6" fill="#7C3AED"/>
    <text x="78" y="125" text-anchor="middle">10%</text>
    <rect x="102" y="104" width="72" height="34" rx="6" fill="#5B21B6"/>
    <text x="138" y="125" text-anchor="middle">20%</text>
    <rect x="180" y="104" width="252" height="34" rx="6" fill="#3B0F7A"/>
    <text x="306" y="125" text-anchor="middle">70% — ecosystem reserve</text>
  </g>
  <g font-size="11" fill="#9CA3AF">
    <text x="78" y="156" text-anchor="middle">liquidity pool</text>
    <text x="78" y="170" text-anchor="middle">at launch</text>
    <text x="138" y="156" text-anchor="middle">founder</text>
    <text x="138" y="170" text-anchor="middle">6mo cliff + 4y</text>
    <text x="306" y="156" text-anchor="middle">40 quarterly tranches · ~10 years · decreasing</text>
    <text x="306" y="170" text-anchor="middle">weights 40→1 · unclaimed = burned</text>
  </g>

  <!-- decay tranches -->
  <text x="60" y="220" fill="#D2A8FF" font-size="13" font-weight="bold">RESERVE RELEASE — DECELERATING BY CONSTRUCTION</text>
  <g fill="#7C3AED">
    <rect x="60"  y="240" width="20" height="140" rx="4"/>
    <rect x="86"  y="258" width="20" height="122" rx="4" opacity="0.95"/>
    <rect x="112" y="275" width="20" height="105" rx="4" opacity="0.9"/>
    <rect x="138" y="289" width="20" height="91"  rx="4" opacity="0.85"/>
    <rect x="164" y="302" width="20" height="78"  rx="4" opacity="0.8"/>
    <rect x="190" y="313" width="20" height="67"  rx="4" opacity="0.75"/>
    <rect x="216" y="323" width="20" height="57"  rx="4" opacity="0.7"/>
    <rect x="242" y="332" width="20" height="48"  rx="4" opacity="0.65"/>
    <rect x="268" y="340" width="20" height="40"  rx="4" opacity="0.6"/>
    <rect x="294" y="347" width="20" height="33"  rx="4" opacity="0.55"/>
    <rect x="320" y="353" width="20" height="27"  rx="4" opacity="0.5"/>
    <rect x="346" y="358" width="20" height="22"  rx="4" opacity="0.45"/>
    <rect x="372" y="362" width="20" height="18"  rx="4" opacity="0.4"/>
    <rect x="398" y="365" width="20" height="15"  rx="4" opacity="0.38"/>
    <rect x="424" y="368" width="20" height="12"  rx="4" opacity="0.36"/>
    <rect x="450" y="370" width="20" height="10"  rx="4" opacity="0.34"/>
    <rect x="476" y="372" width="20" height="8"   rx="4" opacity="0.32"/>
    <rect x="502" y="374" width="20" height="6"   rx="4" opacity="0.3"/>
  </g>
  <text x="70" y="234" fill="#FFFFFF" font-size="10">~34.1M</text>
  <text x="510" y="396" fill="#9CA3AF" font-size="10">~0.85M · quarter 40</text>
  <text x="290" y="404" fill="#9CA3AF" font-size="11">each tranche lives one quarter — what is not claimed is destroyed</text>

  <!-- right panel: where tranches go -->
  <rect x="580" y="210" width="340" height="180" rx="12" fill="#17181F" stroke="#7C3AED"/>
  <text x="750" y="238" text-anchor="middle" fill="#D2A8FF" font-size="13" font-weight="bold">QUARTERLY CYCLE</text>
  <g fill="#FFFFFF" font-size="11.5">
    <text x="600" y="266">1 · tranche opens in ReserveVesting</text>
    <text x="600" y="290">2 · Safe pulls what sells → exchange</text>
    <text x="600" y="314">3 · unclaimed remainder → auto-burn</text>
    <text x="600" y="338">4 · unsold-on-exchange → CEX bot → DEAD</text>
    <text x="600" y="362">5 · next tranche opens only after settle</text>
  </g>
  <text x="750" y="384" text-anchor="middle" fill="#9CA3AF" font-size="10">no token can idle — sold or burned</text>
</svg>
